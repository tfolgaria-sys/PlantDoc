
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Plant Collection</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Kalam:wght@400;700&display=swap');

        :root {
            --black: #111;
            --white: #fff;
            --screentone-dot: #ccc;
            --panel-bg: #fff;
            /* LOKALE DATEIEN: Diese Namen müssen exakt mit den Dateinamen auf deinem PC übereinstimmen! */
            --girl-bg: url('manga_grid.png');
            --plants-bg: url('manga_plants.png');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Kalam', 'Comic Sans MS', cursive, sans-serif;
            background-color: var(--white);
            background-image: radial-gradient(var(--screentone-dot) 2px, transparent 2px);
            background-size: 10px 10px;
            color: var(--black);
            padding: 20px;
            padding-bottom: 300px; /* Platz für das Manga-Mädchen unten */
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        h1 {
            font-family: 'Bangers', cursive;
            font-size: 4rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--white);
            -webkit-text-stroke: 3px var(--black);
            text-shadow: 6px 6px 0 var(--black);
            display: inline-block;
            transform: rotate(-2deg);
        }

        /* --- VIDEO OVERLAY --- */
        #video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }

        #intro-video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Passt das Video an den gesamten Bildschirm an */
        }

        #skip-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: var(--white);
            border: 4px solid var(--black);
            font-family: 'Bangers', cursive;
            font-size: 1.5rem;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 4px 4px 0 var(--black);
            transition: transform 0.1s;
            z-index: 10000;
        }

        #skip-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0 0 0 var(--black);
        }

        #start-prompt {
            position: absolute;
            color: var(--white);
            font-family: 'Bangers', cursive;
            font-size: 3rem;
            text-shadow: 4px 4px 0 var(--black);
            cursor: pointer;
            z-index: 10001;
            display: none; /* Wird über JS gesteuert, falls Autoplay blockiert wird */
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 20px 40px;
            border-radius: 20px;
            border: 4px dashed var(--white);
        }

        #start-prompt:hover {
            transform: scale(1.05);
        }

        /* --- MANGA PANELS --- */
        .comic-page {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: var(--panel-bg);
            border: 5px solid var(--black);
            box-shadow: 10px 10px 0 var(--black);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .panel-1 { grid-column: 1 / -1; }

        .panel-title {
            font-family: 'Bangers', cursive;
            background: var(--black);
            color: var(--white);
            display: inline-block;
            padding: 5px 20px;
            font-size: 1.8rem;
            transform: skew(-10deg);
            margin-bottom: 20px;
            letter-spacing: 1px;
            box-shadow: 4px 4px 0px #888;
        }

        /* --- BUTTONS --- */
        .plant-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
        }

        .plant-card {
            background: var(--white);
            border: 3px solid var(--black);
            border-radius: 8px;
            padding: 15px 5px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 4px 4px 0 var(--black);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 120px;
            position: relative;
        }

        .plant-card:hover {
            transform: translate(-3px, -3px);
            box-shadow: 7px 7px 0 var(--black);
            background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, #f0f0f0 5px, #f0f0f0 10px);
        }

        .plant-card:active {
            transform: translate(4px, 4px);
            box-shadow: 0 0 0 var(--black);
            background: #ffe4e1;
        }

        /* Das Guckloch für die Pflanzen-Bilder */
        .plant-sprite {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid var(--black);
            margin-bottom: 8px;
            background-color: #fff;
            background-image: var(--plants-bg);
            /* Wir zoomen stark in das große Bild hinein */
            background-size: 800%; 
            background-repeat: no-repeat;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .plant-number {
            position: absolute;
            top: -10px;
            left: -10px;
            background: var(--black);
            color: var(--white);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            border: 2px solid var(--white);
            font-family: 'Bangers', cursive;
            z-index: 2;
        }

        .plant-name {
            font-size: 0.85rem;
            font-weight: 700;
            line-height: 1.2;
            color: var(--black);
            text-transform: uppercase;
        }

        /* --- MANGA MÄDCHEN UI --- */
        .character-ui {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
            padding: 0 20px;
        }

        .dialog-container {
            display: flex;
            align-items: flex-end;
            max-width: 900px;
            width: 100%;
            pointer-events: auto;
            margin-bottom: 20px;
        }

        .speech-bubble {
            background: var(--white);
            border: 5px solid var(--black);
            border-radius: 40px;
            padding: 25px 35px;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--black);
            box-shadow: 8px 8px 0 rgba(0,0,0,0.2);
            position: relative;
            flex-grow: 1;
            margin-right: 30px;
            margin-bottom: 50px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            text-transform: uppercase;
            transition: transform 0.1s;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -25px;
            right: 60px;
            border-width: 25px 0 0 25px;
            border-style: solid;
            border-color: var(--black) transparent transparent transparent;
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -15px;
            right: 63px;
            border-width: 17px 0 0 17px;
            border-style: solid;
            border-color: var(--white) transparent transparent transparent;
            z-index: 1;
        }

        .manga-girl-sprite {
            width: 320px;
            height: 180px;
            background-color: white;
            background-image: var(--girl-bg); 
            background-size: 300% 300%; 
            background-position: 100% 100%; 
            border: 5px solid var(--black);
            border-radius: 15px;
            box-shadow: 8px 8px 0 rgba(0,0,0,0.3);
            pointer-events: auto;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: float-manga 4s ease-in-out infinite;
        }

        @keyframes float-manga {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @media (max-width: 900px) {
            .comic-page { grid-template-columns: 1fr; }
            .dialog-container {
                flex-direction: column;
                align-items: center;
            }
            .speech-bubble {
                margin-right: 0;
                margin-bottom: 20px;
                order: -1;
                width: 90%;
            }
            .speech-bubble::after {
                bottom: -25px;
                right: 50%;
                transform: translateX(50%);
                border-width: 25px 15px 0 15px;
            }
            .speech-bubble::before {
                bottom: -15px;
                right: 50%;
                transform: translateX(50%);
                border-width: 17px 10px 0 10px;
            }
            .manga-girl-sprite {
                width: 280px;
                height: 157px;
            }
        }
    </style>
</head>
<body>

    <!-- Intro Video Overlay -->
    <div id="video-overlay">
        <video id="intro-video" playsinline>
            <source src="PlantDoc Video.mp4" type="video/mp4">
            Dein Browser unterstützt das Video-Tag nicht.
        </video>
        <div id="start-prompt">Klicke hier, um zu starten! 🎬</div>
        <button id="skip-btn">Überspringen ⏭️</button>
    </div>

    <header>
        <h1>Pflanzen Manga</h1>
    </header>

    <div class="comic-page">
        <div class="panel panel-1" id="zone-1-container"></div>
        <div class="panel" id="zone-2-container"></div>
        <div class="panel" id="zone-3-container"></div>
    </div>

    <!-- Manga Charakter UI -->
    <div class="character-ui">
        <div class="dialog-container">
            <div class="speech-bubble" id="bubble-box">
                <span id="dialog-text">JEDER KLEINE TRIEB IST EIN GRUND ZUM FEIERN! 💖</span>
            </div>
            <div class="manga-girl-sprite" id="manga-avatar"></div>
        </div>
    </div>

    <script>
        // --- VIDEO LOGIK ---
        const videoOverlay = document.getElementById('video-overlay');
        const introVideo = document.getElementById('intro-video');
        const skipBtn = document.getElementById('skip-btn');
        const startPrompt = document.getElementById('start-prompt');

        function closeVideo() {
            videoOverlay.style.opacity = '0';
            setTimeout(() => {
                videoOverlay.style.display = 'none';
                introVideo.pause();
                // Optional: introVideo.src = ""; // Falls Speicher gespart werden soll
            }, 1000);
        }

        // Wenn das Video zu Ende ist oder auf "Überspringen" geklickt wird
        introVideo.addEventListener('ended', closeVideo);
        skipBtn.addEventListener('click', closeVideo);

        // Autoplay-Policy: Die meisten Browser blockieren Video mit Ton, wenn es nicht vom Nutzer gestartet wurde.
        let playPromise = introVideo.play();

        if (playPromise !== undefined) {
            playPromise.then(_ => {
                // Autoplay hat funktioniert!
                startPrompt.style.display = 'none';
            })
            .catch(error => {
                // Autoplay wurde blockiert. Zeige den "Start"-Hinweis.
                startPrompt.style.display = 'block';
                introVideo.pause();
            });
        }

        // Klick auf den Start-Hinweis startet das Video
        startPrompt.addEventListener('click', () => {
            startPrompt.style.display = 'none';
            introVideo.play();
        });


        // --- DATEN ---
        // Die bgPos Werte (X Y) geben an, wo im "manga_plants.png" Bild wir das Gesicht der Pflanze finden
        const plantsData = [
            // BILD 1 (Linkes Drittel) - Lokale Einzelbilder R1 bis R11
            { id: 1, zone: 1, imgUrl: "R1.png", bgPos: "5% 15%", name: "Croton", care: "HEYY! ICH BRAUCHE VIEL HELLES LICHT FÜR MEINE BUNTEN BLÄTTER! VERGISS MICH NICHT! ✨" },
            { id: 2, zone: 1, imgUrl: "R2.png", bgPos: "20% 15%", name: "Kugelkaktus", care: "STELL MICH IN DIE VOLLE SONNE! NUR GIEßEN WENN ICH STAUBTROCKEN BIN! ☀️" },
            { id: 3, zone: 1, imgUrl: "R3.png", bgPos: "32% 15%", name: "Welk", care: "PEACEFUL SIGH... OH NEIN! ICH BRAUCHE DRINGEND WASSER! HILF MIR! 😭" },
            { id: 4, zone: 1, imgUrl: "R4.png", bgPos: "12% 28%", name: "Sukkulente", care: "ZZZ... LASS MICH SCHLAFEN! WENIG WASSER, VIEL LICHT, BITTE! 🌙" },
            { id: 5, zone: 1, imgUrl: "R5.png", bgPos: "5% 40%", name: "Mini Kaktus", care: "GUGUG! GANZ VORSICHTIG GIEßEN, ICH BIN NOCH EIN BABY! 🍼" },
            { id: 6, zone: 1, imgUrl: "R6.png", bgPos: "20% 45%", name: "Adenium", care: "GÂN! ICH BRAUCHE PRALLE SONNE FÜR MEINE MUSKELN! 💪💥" },
            { id: 7, zone: 1, imgUrl: "R7.png", bgPos: "35% 40%", name: "Dino-Topf", care: "CHARGE! KEINE STAUNÄSSE, SONST GREIFT DER T-REX AN! ⚔️" },
            { id: 8, zone: 1, imgUrl: "R8.png", bgPos: "10% 70%", name: "Bogenhanf", care: "EXTREM SELTEN GIEßEN. LASS MICH EINFACH IN RUHE. 😎" },
            { id: 9, zone: 1, imgUrl: "R9.png", bgPos: "5% 85%", name: "Calathea", care: "PSST! ICH BIN EIN NINJA! HALTE MEINE ERDE LEICHT FEUCHT! 🍃" },
            { id: 10, zone: 1, imgUrl: "R10.png", bgPos: "25% 65%", name: "Sukkulente", care: "ALERT! KEINE DIREKTE MITTAGSSONNE FÜR MICH! 💢" },
            { id: 11, zone: 1, imgUrl: "R11.png", bgPos: "15% 95%", name: "Pilea", care: "WOW, UFOS! DREH MICH AB UND ZU, DAMIT ICH GERADE WACHSE! 👽" },
            
            // Restliche der Fensterbank (noch aus dem großen Sprite, solange du noch keine R-Bilder dafür hast)
            { id: 12, zone: 1, bgPos: "30% 90%", name: "Kleine Pflanze", care: "PUH, HEIß! BEFREIE MICH AUS DER FOLIE, DAMIT WASSER ABFLIEßT! 💦" },
            { id: 13, zone: 1, bgPos: "40% 85%", name: "Steckling", care: "JUHU! WECHSLE MEIN WASSER, BIS ICH WURZELN HABE! 🌊" },

            // BILD 2 (Mittleres Drittel)
            { id: 14, zone: 2, bgPos: "45% 15%", name: "Ceropegia", care: "HÄNG MICH HELL AUF UND GIEß MICH ERST WENN ICH TROCKEN BIN! 🌸" },
            { id: 15, zone: 2, bgPos: "53% 15%", name: "Tradescantia", care: "ICH WACHSE WIE VERRÜCKT BEI HELLEM LICHT! ✨" },
            { id: 16, zone: 2, bgPos: "62% 15%", name: "Hängepflanze 3", care: "INDIREKTES LICHT MACHT MICH WUNSCHLOS GLÜCKLICH! 🥰" },
            { id: 17, zone: 2, bgPos: "68% 10%", name: "Hängepflanze 4", care: "ERDSCHICHT IMMER ERST LEICHT ANTROCKNEN LASSEN! 💦" },
            { id: 18, zone: 2, bgPos: "75% 10%", name: "Hängepflanze 5", care: "HELLES LICHT UND MÄßIG WASSER, NICHT ÜBERGIEßEN! ☀️" },
            { id: 19, zone: 2, bgPos: "45% 55%", name: "Echinocactus", care: "GIB MIR DIE VOLLE SONNE! ABSOLUTE TROCKENRUHE IM WINTER! 🌞" },
            { id: 20, zone: 2, bgPos: "50% 60%", name: "Sukkulente", care: "SONNIGES PLÄTZCHEN UND SEHR WENIG WASSER! 🤫" },
            { id: 21, zone: 2, bgPos: "55% 58%", name: "Lithops", care: "FAST GAR NICHT GIEßEN! SONST PLATZE ICH! 💥" },
            { id: 22, zone: 2, bgPos: "62% 60%", name: "Sukkulente", care: "HELLER STANDORT UND GANZ SPARSAM GIEßEN! 🪴" },
            { id: 23, zone: 2, bgPos: "68% 50%", name: "Säulenkaktus", care: "ICH WILL HOCH HINAUS! VIEL SONNE, WENIG WASSER! 🌵" },
            { id: 24, zone: 2, bgPos: "85% 55%", name: "Kaktus Duo", care: "GANZ WENIG GIEßEN UND GANZ VIEL SONNE TANKEN! 👯‍♀️" },
            { id: 25, zone: 2, bgPos: "90% 55%", name: "Kaktus Mix", care: "VORSICHTIG MIT DER GIEßKANNE BEI UNS ALLEN! 🚫💦" },
            { id: 26, zone: 2, bgPos: "95% 50%", name: "Bogenhanf", care: "ICH BIN FAST UNKAPUTTBAR! NUR STAUNÄSSE HASSE ICH! 🛡️" },

            // BILD 3 (Rechtes Drittel)
            { id: 27, zone: 3, bgPos: "45% 90%", name: "Efeutute", care: "GIEß MICH ERST, WENN DIE ERDE OBERFLÄCHLICH TROCKEN IST! 🍃" },
            { id: 28, zone: 3, bgPos: "60% 90%", name: "Monkey Mask", care: "MONKEY MASK HIER! SPRÜH MICH AB UND ZU MAL AN! 🐒" },
            { id: 29, zone: 3, bgPos: "72% 90%", name: "Njoy", care: "VIEL INDIREKTES LICHT FÜR MEINE WEIßEN FLECKEN! ✨" },
            { id: 30, zone: 3, bgPos: "80% 80%", name: "Monstera", care: "ICH BRAUCHE PLATZ! WISCH MEINE GROßEN BLÄTTER AB! 🦖" },
            { id: 31, zone: 3, bgPos: "85% 15%", name: "Hohe Pflanze", care: "ICH BRAUCHE STABILEN HALT UND EINEN HELLEN PLATZ! 🪵" },
            { id: 32, zone: 3, bgPos: "88% 85%", name: "Bogenhanf 2", care: "HALBSCHATTEN IST OKAY. ABER SEHR SPARSAM GIEßEN! 🪴" },
            { id: 33, zone: 3, bgPos: "92% 65%", name: "Mix Regal", care: "HELL, ABER OHNE PRALLE SONNE! ERDE LEICHT FEUCHT! 💧" },
            { id: 34, zone: 3, bgPos: "98% 85%", name: "Terrarium", care: "LUFTFEUCHTIGKEIT IST HIER SUPER! FAST NIE GIEßEN! 🌧️" }
        ];

        function renderZone(zoneNum, titleText, containerId) {
            const container = document.getElementById(containerId);
            const zonePlants = plantsData.filter(p => p.zone === zoneNum);
            
            const title = document.createElement('h2');
            title.className = 'panel-title';
            title.textContent = titleText;
            container.appendChild(title);

            const grid = document.createElement('div');
            grid.className = 'plant-grid';

            zonePlants.forEach(plant => {
                const card = document.createElement('div');
                card.className = 'plant-card';
                card.onclick = () => showCareInstruction(plant.care);
                
                // HIER WIRD GEPRÜFT, OB EIN EIGENES BILD (z.B. R1.png) ANGEGEBEN IST
                let spriteStyle = '';
                if (plant.imgUrl) {
                    spriteStyle = `background-image: url('${plant.imgUrl}'); background-size: cover; background-position: center;`;
                } else {
                    spriteStyle = `background-position: ${plant.bgPos};`;
                }

                // HIER IST DER NEUE SPRITE DIV FÜR DIE PFLANZEN!
                card.innerHTML = `
                    <div class="plant-number">${plant.id}</div>
                    <div class="plant-sprite" style="${spriteStyle}"></div>
                    <div class="plant-name">${plant.name}</div>
                `;
                grid.appendChild(card);
            });

            container.appendChild(grid);
        }

        renderZone(1, "PANEL 1: FENSTERBANK LINKS", "zone-1-container");
        renderZone(2, "PANEL 2: FENSTERBANK RECHTS", "zone-2-container");
        renderZone(3, "PANEL 3: DIE PFLANZENECKE", "zone-3-container");

        let typeWriterInterval;
        
        // Die 9 Positionen des Mädchens
        const panelPositions = [
            "0% 0%", "50% 0%", "100% 0%",
            "0% 50%", "50% 50%", "100% 50%",
            "0% 100%", "50% 100%", "100% 100%"
        ];
        let currentPanel = 8; 

        function showCareInstruction(text) {
            const dialogBox = document.getElementById('dialog-text');
            const bubble = document.getElementById('bubble-box');
            const avatar = document.getElementById('manga-avatar');
            
            clearInterval(typeWriterInterval); 
            dialogBox.innerHTML = ''; 
            
            bubble.style.transform = 'scale(1.1)';
            avatar.style.transform = 'scale(1.05)';
            setTimeout(() => {
                bubble.style.transform = 'scale(1)';
                avatar.style.transform = 'scale(1)';
            }, 150);

            let newPanel;
            do { newPanel = Math.floor(Math.random() * 9); } while (newPanel === currentPanel);
            
            currentPanel = newPanel;
            avatar.style.backgroundPosition = panelPositions[currentPanel];

            let i = 0;
            typeWriterInterval = setInterval(() => {
                if (i < text.length) {
                    dialogBox.innerHTML += text.charAt(i);
                    i++;
                } else {
                    clearInterval(typeWriterInterval);
                }
            }, 20); 
        }
    </script>
</body>
</html>
